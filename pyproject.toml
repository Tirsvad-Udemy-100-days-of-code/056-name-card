[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "name-card"
version = "0.1.0"
description = "A personal name card website served with Flask (Udemy 100 Days of Code, day 56)."
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
authors = [{ name = "Jens Tirsvad Nielsen" }]
dependencies = ["flask>=3.0"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
name-card = "name_card.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
name_card = ["templates/*.html", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
