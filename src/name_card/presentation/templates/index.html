<html lang="en">
	<head>
		<title>{{ profile.name }}</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="{{ url_for('static', filename='assets/css/main.css') }}" />
		<link rel="stylesheet" href="{{ url_for('static', filename='assets/css/card.css') }}" />
		<noscript><link rel="stylesheet" href="{{ url_for('static', filename='assets/css/noscript.css') }}" /></noscript>
	</head>
	<body class="is-preload">

		<!-- Wrapper -->
			<div id="wrapper">

				<!-- Main -->
					<section id="main">
						<header>
							<span class="avatar"><img src="{{ url_for('static', filename=profile.avatar) }}" alt="Portrait of {{ profile.name }}" /></span>
							<h1>{{ profile.name }}</h1>
							<p>{{ profile.headline }}</p>
						</header>
						<footer>
							<ul class="icons">
								{% for link in profile.links %}
								<li><a href="{{ link.url }}" class="icon {{ link.icon_class }}">{{ link.label }}</a></li>
								{% endfor %}
							</ul>
						</footer>
					</section>

				<!-- Footer -->
					<footer id="footer">
						<ul class="copyright">
							<li>&copy; {{ profile.name }}</li><li>Design: <a href="{{ attribution_url }}">{{ attribution_text }}</a></li>
						</ul>
					</footer>

			</div>

		<!-- Scripts -->
			<script>
				if ('addEventListener' in window) {
					window.addEventListener('load', function() { document.body.className = document.body.className.replace(/\bis-preload\b/, ''); });
					document.body.className += (navigator.userAgent.match(/(MSIE|rv:11\.0)/) ? ' is-ie' : '');
				}
			</script>

	</body>
</html>
